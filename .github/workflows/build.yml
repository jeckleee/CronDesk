name: Build and release

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - name: Build application
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Package installer
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          New-Item -ItemType Directory -Force dist | Out-Null
          $binary = Join-Path $env:GITHUB_WORKSPACE 'target\x86_64-pc-windows-msvc\release\crondesk.exe'
          $installer = Join-Path $env:GITHUB_WORKSPACE "dist\CronDesk-$version-windows-x64-setup.exe"
          $icon = Join-Path $env:GITHUB_WORKSPACE 'assets\CronDesk.ico'
          if (!(Test-Path $binary -PathType Leaf)) { throw "Missing executable: $binary" }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /INPUTCHARSET UTF8 "/DVERSION=$version" "/DAPP_EXE=$binary" "/DOUTPUT_FILE=$installer" "/DICON_FILE=$icon" installer/windows.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CronDesk-windows-x64
          path: dist/CronDesk-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS universal installer
    runs-on: macos-15
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build application for Apple Silicon and Intel
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package disk image
        run: bash installer/macos.sh
      - name: Upload macOS installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CronDesk-macos-universal
          path: dist/CronDesk-*-macos-universal.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download both installers
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: CronDesk-*
          path: dist
          merge-multiple: true
      - name: Publish release with installers
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="v${version}-build.${BUILD_NUMBER}"
          windows="dist/CronDesk-${version}-windows-x64-setup.exe"
          macos="dist/CronDesk-${version}-macos-universal.dmg"
          test -s "$windows"
          test -s "$macos"
          cat > "$RUNNER_TEMP/release-notes.txt" <<EOF_NOTES
          自动构建：$COMMIT_SHA

          - Windows 11 x64：下载 .exe 安装程序。
          - macOS Apple Silicon / Intel：下载 .dmg，将 CronDesk 拖入 Applications。
          - 升级前请通过系统托盘退出旧版；现有任务、服务配置及日志会保留。
          - 安装包尚未使用商业代码签名证书，macOS 应用未经过 Apple 公证。
          EOF_NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$windows" "$macos" --clobber
          else
            gh release create "$tag" "$windows" "$macos" --target "$COMMIT_SHA" \
              --title "CronDesk ${version} · Build ${BUILD_NUMBER}" \
              --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi
