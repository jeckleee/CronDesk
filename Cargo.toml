[package]
name = "crondesk"
version = "0.2.2"
edition = "2024"
description = "A lightweight native desktop cron task manager"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
croner = "3.0"
dirs = "6.0"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.33.3", default-features = false }
encoding_rs = "0.8"
rfd = "0.15.4"
rusqlite = { version = "0.38", features = ["bundled"] }
tray-icon = "0.25.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
